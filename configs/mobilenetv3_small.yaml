# ============================================================
# MobileNetV3-Small config
# Audio Deepfake Detection
# Input: Precomputed Log-Mel image 128 x 128 x 3
# Backbone: MobileNetV3-Small pretrained ImageNet
# ============================================================

# ============================================================
# 1. Project information
# ============================================================

project:
  name: "audio_deepfake_detection"
  task: "binary_classification"
  model_family: "mobilenetv3"
  model_name: "mobilenetv3_small"
  experiment_name: "mobilenetv3_small_128x128x3_imagenet"
  seed: 42
  description: "MobileNetV3-Small pretrained ImageNet for audio deepfake detection using precomputed Log-Mel image features."

# ============================================================
# 2. Paths
# ============================================================

paths:
  # ----------------------------------------------------------
  # Source metadata and source Log-Mel features from CNN pipeline
  # These are used by mobilenetv3_precompute.py
  # ----------------------------------------------------------
  source_metadata_dir: "data/metadata"
  source_train_metadata: "data/metadata/train.csv"
  source_dev_metadata: "data/metadata/dev.csv"
  source_eval_metadata: "data/metadata/eval.csv"

  source_processed_dir: "data/processed/logmel_64_4s"
  source_train_feature_dir: "data/processed/logmel_64_4s/train"
  source_dev_feature_dir: "data/processed/logmel_64_4s/dev"
  source_eval_feature_dir: "data/processed/logmel_64_4s/eval"

  # ----------------------------------------------------------
  # MobileNetV3 metadata
  # These CSV files will be created by mobilenetv3_precompute.py
  # feature_path in these files points to 128x128x3 features
  # ----------------------------------------------------------
  metadata_dir: "data/metadata_mobilenetv3"
  train_metadata: "data/metadata_mobilenetv3/train.csv"
  dev_metadata: "data/metadata_mobilenetv3/dev.csv"
  eval_metadata: "data/metadata_mobilenetv3/eval.csv"

  # ----------------------------------------------------------
  # MobileNetV3 precomputed features
  # Each .npy file shape: [128, 128, 3]
  # ----------------------------------------------------------
  processed_dir: "data/processed/mobilenetv3_128x128x3"
  train_feature_dir: "data/processed/mobilenetv3_128x128x3/train"
  dev_feature_dir: "data/processed/mobilenetv3_128x128x3/dev"
  eval_feature_dir: "data/processed/mobilenetv3_128x128x3/eval"

  # ----------------------------------------------------------
  # Outputs
  # ----------------------------------------------------------
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints/mobilenetv3_small"
  saved_model_dir: "outputs/saved_models/mobilenetv3_small"
  tflite_dir: "outputs/tflite/mobilenetv3_small"
  log_dir: "outputs/logs/mobilenetv3_small"
  result_dir: "outputs/results/mobilenetv3_small"

# ============================================================
# 3. Source audio configuration
# ============================================================
# Kept for traceability.
# MobileNetV3 does not read raw audio directly.
# It uses precomputed Log-Mel features generated from this setup.

audio:
  sample_rate: 16000
  duration: 4.0
  target_samples: 64000
  mono: true
  pad_mode: "constant"
  trim_mode: "start"

# ============================================================
# 4. Source Log-Mel feature configuration
# ============================================================
# This describes the source feature from CNN pipeline:
# data/processed/logmel_64_4s/*.npy

source_feature:
  name: "logmel_64_4s"
  input_shape: [64, 251, 1]
  n_mels: 64
  expected_frames: 251
  source_dtype: "float16"

# ============================================================
# 5. MobileNetV3 precompute feature configuration
# ============================================================
# Converts source Log-Mel [64, 251] to image-like [128, 128, 3].

precompute:
  enable: true
  source_feature_column: "feature_path"
  output_feature_column: "feature_path"

  image_height: 128
  image_width: 128
  image_channels: 3
  output_shape: [128, 128, 3]

  # Conversion strategy:
  # 1. Load source Log-Mel [64, 251] or [64, 251, 1]
  # 2. Normalize each sample to [0, 1]
  # 3. Resize to [128, 128]
  # 4. Convert to 3 channels
  # 5. Scale to [0, 255]
  normalization:
    method: "sample_minmax"
    eps: 0.000001
    output_min: 0.0
    output_max: 1.0

  resize:
    method: "bilinear"
    preserve_aspect_ratio: false

  channel:
    method: "repeat"
    channels: 3

  scale:
    output_min: 0.0
    output_max: 255.0

  storage_dtype: "float16"
  overwrite: false

# ============================================================
# 6. Feature configuration used by shared dataset_loader.py
# ============================================================
# dataset_loader.py will read:
#   feature.input_shape
#   feature.train_dtype
#
# For MobileNetV3:
#   input_shape = [128, 128, 3]
#   feature files are stored in data/processed/mobilenetv3_128x128x3/

feature:
  name: "mobilenetv3_128x128x3"
  input_shape: [128, 128, 3]
  storage_dtype: "float16"
  train_dtype: "float32"

  # Because model.backbone.include_preprocessing = true,
  # model expects input image-like values in [0, 255].
  value_range:
    min: 0.0
    max: 255.0

# ============================================================
# 7. Labels
# ============================================================

labels:
  negative_class:
    id: 0
    name: "bonafide"
    description: "Real / genuine audio"

  positive_class:
    id: 1
    name: "spoof"
    description: "Fake / spoofed / deepfake audio"

  positive_label: 1
  threshold_default: 0.5

# ============================================================
# 8. Dataloader
# ============================================================
# MobileNetV3 is heavier than CNN baseline.
# Start with batch_size 8 for laptop CPU safety.

dataloader:
  batch_size: 16
  shuffle_buffer_size: 4096
  num_parallel_calls: "AUTOTUNE"
  prefetch: "AUTOTUNE"
  drop_remainder: false

# ============================================================
# 9. Augmentation
# ============================================================
# For first version, keep augmentation disabled.
# Add augmentation only after baseline MobileNetV3 is stable.

augmentation:
  enable: false

  random_gain:
    enable: false
    min_gain: 0.9
    max_gain: 1.1

  random_noise:
    enable: false
    std: 0.01

  random_time_mask:
    enable: false
    max_width: 20

  random_freq_mask:
    enable: false
    max_width: 8

# ============================================================
# 10. Model
# ============================================================

model:
  name: "MobileNetV3Small_LogMel_AudioDeepfake"
  input_shape: [128, 128, 3]

  backbone:
    architecture: "MobileNetV3Small"
    weights: "imagenet"
    include_top: false
    include_preprocessing: true
    pooling: "avg"

    # alpha < 1.0 makes the model lighter.
    # Good starting point for laptop CPU.
    alpha: 0.75

    minimalistic: false
    dropout_rate: 0.2

    # Stage 1: freeze pretrained backbone, train classifier head only.
    base_trainable: false

  classifier:
    dropout_1: 0.30
    dense_units: 128
    dense_activation: "relu"
    dropout_2: 0.20
    output_units: 1
    output_activation: "sigmoid"

# ============================================================
# 11. Training
# ============================================================

training:
  epochs: 20

  # Optional two-stage training design.
  # Version 1 starts with frozen backbone only.
  stages:
    stage_1:
      enable: true
      name: "train_classifier_head"
      base_trainable: false
      epochs: 15
      learning_rate: 0.0003

    stage_2:
      enable: false
      name: "fine_tune_last_layers"
      base_trainable: true
      fine_tune_from_layer: -30
      epochs: 5
      learning_rate: 0.00003

  optimizer:
    name: "adam"
    learning_rate: 0.0003

  loss: "binary_crossentropy"

  metrics:
    - "accuracy"
    - "roc_auc"

  class_weight:
    enable: true
    method: "balanced"

  mixed_precision:
    enable: false

# ============================================================
# 12. Callbacks
# ============================================================

callbacks:
  model_checkpoint:
    enable: true
    filepath: "outputs/checkpoints/mobilenetv3_small/best_mobilenetv3_small.keras"
    monitor: "val_roc_auc"
    mode: "max"
    save_best_only: true
    save_weights_only: false
    verbose: 1

  early_stopping:
    enable: true
    monitor: "val_roc_auc"
    mode: "max"
    patience: 3
    restore_best_weights: true
    verbose: 1

  reduce_lr_on_plateau:
    enable: true
    monitor: "val_loss"
    mode: "min"
    factor: 0.5
    patience: 2
    min_lr: 0.000001
    verbose: 1

  csv_logger:
    enable: true
    filename: "outputs/logs/mobilenetv3_small/training_log.csv"
    append: false

# ============================================================
# 13. Evaluation
# ============================================================

evaluation:
  threshold: 0.5
  class_names:
    - "bonafide"
    - "spoof"

  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "eer"
    - "confusion_matrix"
    - "classification_report"

  save_predictions: true
  save_confusion_matrix: true
  save_roc_curve: true

# ============================================================
# 14. Deployment
# ============================================================

deployment:
  target: android_cpu
  inference_threshold: 0.606

  tflite:
    enable: true
    checkpoint_path: outputs/checkpoints/mobilenetv3_small/best_mobilenetv3_small.keras
    output_dir: outputs/tflite/mobilenetv3_small
    formats:
      - fp32
      - fp16
      - dynamic
    allow_select_tf_ops: false
    output_paths:
      fp32: outputs/tflite/mobilenetv3_small/mobilenetv3_small_fp32.tflite
      fp16: outputs/tflite/mobilenetv3_small/mobilenetv3_small_fp16.tflite
      dynamic: outputs/tflite/mobilenetv3_small/mobilenetv3_small_dynamic_range.tflite

# ============================================================
# 15. Debug
# ============================================================

debug:
  enable: false
  max_train_samples: 1000
  max_dev_samples: 500
  max_eval_samples: 500

  precompute:
    max_train_samples: 1000
    max_dev_samples: 500
    max_eval_samples: 500
